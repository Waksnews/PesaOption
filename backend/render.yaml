services:
  - type: web
    name: pesaoption-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        sync: false
      - key: ZETUPAY_SECRET_KEY
        sync: false
      - key: ZETUPAY_API_URL
        value: https://pay.zetupay.co.ke/api/v1
      - key: ZETUPAY_REDIRECT_URL
        value: https://pesaoption.site/deposit/callback
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: LIPIA_API_KEY
        sync: false
      - key: LIPIA_BASE_URL
        value: https://lipia-api.kreativelabske.com/api/v2
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: PesaOption Security <no-reply@pesaoption.com>
